version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mdd-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mdd-network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: mdd-gotenberg
    ports:
      - "${GOTENBERG_PORT:-3001}:3000"
    environment:
      - LOG_LEVEL=info
      - LIBREOFFICE_AUTO_RESTART=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - mdd-network

networks:
  mdd-network:
    driver: bridge

volumes:
  redis_data:
